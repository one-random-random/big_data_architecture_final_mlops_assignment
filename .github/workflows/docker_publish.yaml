name: Publish Docker Image - Salary App
on:
  workflow_run:
    workflows:
      - Continious Training - Clean, Train, Verify and Upload
    types:
      - completed

jobs:
  publish_image:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKER_HUB_USERNAME}}
          password: ${{secrets.DOCKER_HUB_ACCESS_TOKEN}}
      - name: Build Image
        run: docker build . -t kdocker99/salary-prediction-app:latest
      - name: Push image to Docker Hub
        run: docker push kdocker99/salary-prediction-app:latest