name: Publish Docker Image - Salary App
on:
  workflow_run:
    workflows:
      - Continious Training - Clean, Train, Verify and Upload
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  publish_image:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      - name: Download trained model from Continious Training workflow
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          name: salary-model
          path: models/
      
      - name: List models directory
        run: ls -la models/

      - name: Confirm downloaded model
        run: |
          test -f models/YearsExperienceSalaryModel.pkl || {
            echo "Trained model artifact was not downloaded correctly."
            exit 1
          }

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKER_HUB_USERNAME}}
          password: ${{secrets.DOCKER_HUB_ACCESS_TOKEN}}

      - name: Build Image
        run: docker build . -t kdocker99/salary-prediction-app:latest

      - name: Push image to Docker Hub
        run: docker push kdocker99/salary-prediction-app:latest